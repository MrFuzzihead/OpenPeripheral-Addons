name: Game tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  server-game-test:
    name: Dedicated server in-game tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept EULA
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt

      - name: Run in-game game tests
        run: |
          set -o pipefail
          timeout 900 ./gradlew gameTestServer --console=plain --no-configuration-cache 2>&1 | tee game-test.log

      - name: Check game-test marker
        if: always()
        run: grep -q "OPENPERIPHERAL_ADDONS_GAMETEST_OK" game-test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-test-log
          path: game-test.log
          if-no-files-found: ignore
